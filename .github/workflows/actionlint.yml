---
name: actionlint
'on':
  pull_request:
    paths: &paths
      - .github/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ./actionlint
          key: actionlint-1.7.12-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          srv=https://raw.githubusercontent.com/rhysd/actionlint
          ver=1.7.12
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$srv/v$ver/scripts/download-actionlint.bash" |
            bash -s "$ver"
      - run: ./actionlint
