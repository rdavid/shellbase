---
name: test-bsd
'on':
  pull_request:
    paths: &paths
      - '*.do'
      - .github/workflows/test-bsd.yml
      - app/**
      - lib/**
      - Makefile
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: sh
jobs:
  test-bsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@v1.6.0
        with:
          prepare: |
            pkg update
            pkg install --yes \
              bash \
              curl \
              goredo \
              p5-Digest-SHA
            cd /usr/local/bin
            goredo -symlinks
            cd -
            ln -s /usr/local/bin/bash /bin/bash
          run: |
            redo -xx lint test
