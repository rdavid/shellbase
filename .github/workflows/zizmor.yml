---
name: zizmor
'on':
  pull_request:
    paths: &paths
      - .github/**
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: sh
jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ver: 1.31.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-zizmor-${{ env.ver }}
      - run: pipx run "zizmor==$ver" .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
