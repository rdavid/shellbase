#
# Configures the lychee link checker. Excludes URLs that shell variables
# complete at run time, the file URL that a failure test expects to miss, and
# Stack Exchange sites, which reject automated requests with 403.
exclude = [
	'/releases/download$',
	'\$',
	'^file:///definitely-not-here$',
	'^https://stackoverflow\.com/',
	'^https://unix\.stackexchange\.com/',
]
